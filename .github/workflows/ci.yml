name: CI

on:
  push:
    branches: [ master ]
    # A change that only touches documentation, the changelog or the manual
    # test workflows cannot change the build result, so it skips the full
    # build. ci.yml and the release workflows are deliberately not listed:
    # changing them still runs the CI.
    paths-ignore:
      - 'docs/**'
      - '**/*.adoc'
      - 'CHANGELOG.md'
      - '.github/workflows/test-*.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.adoc'
      - 'CHANGELOG.md'
      - '.github/workflows/test-*.yml'

# A newer push to the same ref replaces a run that is still going: the
# older commit is covered by the newer run, which builds the newer tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build only reads the repository; no step writes to it, comments on
# pull requests or uses the token for anything else.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Standard runners ship large toolchains this build never touches.
      # Only paths verified as unused (no Android, .NET, Haskell or CodeQL
      # usage in the build) are removed; /opt/hostedtoolcache as a whole is
      # kept because it holds Java and Node. Failures here never fail the job.
      - name: Free disk space
        run: |
          set +e
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # OsSandboxTest's Linux suite (kuml-core-script) is a real behavioural
      # test, not a construction-only test — it launches bwrap and asserts
      # the cage actually blocks filesystem/network escapes. ubuntu-latest
      # does not ship bubblewrap by default.
      - name: Install bubblewrap (Linux OS sandbox test dependency)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build (excluding live LLM tests)
        run: ./gradlew build -DexcludeTags=live

      - name: Disk usage after build
        if: always()
        continue-on-error: true
        run: |
          df -h /
          timeout 120 du -xh --max-depth=1 "$GITHUB_WORKSPACE" 2>/dev/null | sort -rh | head -15
          timeout 120 du -sh ~/.gradle ~/.gradle/caches ~/.gradle/wrapper 2>/dev/null
          timeout 120 find "$GITHUB_WORKSPACE" -maxdepth 3 -name build -type d -prune -exec du -sh {} + 2>/dev/null | sort -rh | head -10
          timeout 60 du -sh /tmp 2>/dev/null
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 7

  # Builds the exported LaTeX with a real TeX installation. The default job above has no TeX,
  # so every pdflatex test is skipped there. Here a missing TeX is a failure
  # (-Pkuml.latex.require=true) and scripts/ci/check_latex_tests.py rejects unmarked skips.
  latex-pdf:
    name: LaTeX PDF build (TeX required)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TEX_PACKAGES: >-
        texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures
        texlive-fonts-recommended texlive-lang-german lmodern texlive-science

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js (kuml-web is on the kuml-cli test classpath chain)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Download first, install offline: a hung mirror then fails in the download step,
      # and the cached archives make later runs independent of it.
      - name: Restore apt archive cache
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: latex-apt-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Download TeX packages
        run: |
          read -ra pkgs <<< "$TEX_PACKAGES"
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only \
            -o Dir::Cache::archives="$HOME/apt-archives" "${pkgs[@]}"

      - name: Install TeX
        run: |
          read -ra pkgs <<< "$TEX_PACKAGES"
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-archives" "${pkgs[@]}"
          sudo chown -R "$USER" ~/apt-archives || true

      - name: Show TeX version
        run: |
          pdflatex --version | head -1
          kpsewhich standalone.cls tikz.sty babel.sty

      - name: Run the pdflatex tests (strict, TeX required)
        run: >-
          ./gradlew clean
          :kuml-io:kuml-io-latex:test :kuml-docs:kuml-workspace-latex:test :kuml-cli:test
          -Pkuml.latex.require=true -Pkuml.latex.only=true
          --no-build-cache --continue -DexcludeTags=live

      - name: Skip guard
        if: always()
        run: python3 -I scripts/ci/check_latex_tests.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-test-results
          path: |
            kuml-io/kuml-io-latex/build/reports/tests/
            kuml-docs/kuml-workspace-latex/build/reports/tests/
            kuml-cli/build/reports/tests/
          retention-days: 7
