name: "Code Quality: CodeQL Analysis"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly scan on Mondays at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      # The ephemeral runner ran out of disk space during the build ("No space left on device").
      # Large preinstalled toolchains this repository never uses are removed first. The CodeQL tool
      # cache (/opt/hostedtoolcache/CodeQL) is deliberately kept: the analysis needs it, and so
      # does /opt/hostedtoolcache as a whole (Java and Node). Failures here never fail the job.
      - name: Free disk space
        run: |
          set +e
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h /
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # Manual build mode — we control the build command below.
          # Avoids CodeQL's autobuild which crashes the Kotlin daemon
          # under its constrained memory environment.
          build-mode: manual

      - name: Build for CodeQL
        # Disable the Kotlin daemon and run compilation in-process to avoid
        # the "Daemon compilation failed" crash seen with CodeQL's autobuild.
        # Only compile classes (no tests, no packaging) — CodeQL needs bytecode,
        # not test results.
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dkotlin.compiler.execution.strategy=in-process
            -Xmx3g
        run: |
          ./gradlew classes \
            -Dorg.gradle.daemon=false \
            -Dkotlin.compiler.execution.strategy=in-process \
            --no-daemon \
            --no-build-cache \
            --parallel \
            -DexcludeTags=live \
            -x test \
            -x ktlintCheck

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
