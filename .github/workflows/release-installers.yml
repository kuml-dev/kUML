name: Release Installers

# Triggered on version tags — e.g. v0.5.1, v2.0.32
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ── Linux: DEB + RPM + Docker image ─────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload (DEB/RPM attach to the GitHub Release)
      packages: write  # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build DEB
        run: ./gradlew :kuml-packaging:packageDeb

      - name: Build RPM
        run: ./gradlew :kuml-packaging:packageRpm

      - name: Upload DEB + RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          # One glob per line: upload-artifact does not expand `{deb,rpm}`
          # brace patterns, so the former single pattern matched nothing and
          # the packages were silently discarded ("No files were found").
          path: |
            kuml-packaging/build/dist/*.deb
            kuml-packaging/build/dist/*.rpm
          if-no-files-found: error

      - name: Attach DEB + RPM to the GitHub Release
        # The Release is created by release.yml for the same tag, in parallel
        # with this workflow, so wait for it to exist before uploading. The
        # apt repository (kuml-dev/apt) pulls its .deb files from here.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          shopt -s nullglob
          FILES=(kuml-packaging/build/dist/*.deb kuml-packaging/build/dist/*.rpm)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .deb/.rpm found in kuml-packaging/build/dist"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "${FILES[@]}" --clobber; then
                exit 0
              fi
              echo "::warning::gh release upload attempt $attempt failed for $TAG"
            else
              echo "Release $TAG does not exist yet (attempt $attempt/30)"
            fi
            sleep 30
          done
          echo "::error::could not attach DEB/RPM to release $TAG"
          exit 1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker CLI image
        run: ./gradlew :kuml-packaging:dockerBuildCli

      - name: Push Docker image (version tag + latest)
        # Strip the leading 'v' from the git tag — Gradle's dockerBuildCli task
        # tags the image with project.version (e.g. "0.6.0"), not the git ref
        # "v0.6.0". Pushing "v0.6.0" would fail with "tag does not exist".
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker push ghcr.io/kuml-dev/kuml-cli:latest
          docker push ghcr.io/kuml-dev/kuml-cli:"$VERSION"

  # ── macOS: DMG (unsigned — Phase 2 adds Apple Developer signing) ─────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build DMG (unsigned)
        run: ./gradlew :kuml-packaging:packageDmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: kuml-packaging/build/dist/*.dmg

  # ── Windows: MSI (unsigned — Phase 2 adds WiX/Authenticode signing) ──────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build MSI (unsigned)
        run: ./gradlew :kuml-packaging:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: kuml-packaging/build/dist/*.msi
