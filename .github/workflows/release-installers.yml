name: Release Installers

# Triggered on version tags — e.g. v0.5.1, v2.0.32
on:
  push:
    tags:
      - 'v*.*.*'
  # Manual run for an existing tag: builds only the Linux packages (DEB/RPM of the
  # CLI and of the desktop app, and the desktop AppImage) from that tag and attaches them to its release
  # (no Docker push, no DMG/MSI). The DEB smoke test is skipped here: it checks the
  # PATH symlink and desktop shortcut, which tags released before those changes
  # (up to v0.56.0) do not contain, so it would fail the backfill.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the CLI and desktop DEB/RPM and the desktop AppImage for (e.g. v0.56.0)"
        required: true

jobs:
  # ── Linux: DEB + RPM + Docker image ─────────────────────────────────────────
  build-linux:
    # Ubuntu 22.04 on purpose: jpackage writes the build host's package names into
    # the DEB dependencies. Built on 24.04 they ask for libasound2t64, which does
    # not exist on Ubuntu 22.04 or Debian 12; built on 22.04 they ask for
    # libasound2, which Ubuntu 24.04 and Debian 13 also provide.
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # gh release upload (DEB/RPM attach to the GitHub Release)
      packages: write  # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Make sure the packaging tools are present
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1 || ! command -v fakeroot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends rpm fakeroot
          fi

      - name: Build DEB
        run: ./gradlew :kuml-packaging:packageDeb

      - name: Build RPM
        run: ./gradlew :kuml-packaging:packageRpm

      - name: Build desktop DEB
        run: ./gradlew :kuml-desktop:packageDeb

      - name: Build desktop RPM
        run: ./gradlew :kuml-desktop:packageRpm

      - name: Smoke test DEB install (CLI + desktop side by side)
        # Push (new release tag) only: old tags checked out by a manual dispatch
        # predate the postinst/shortcut changes and would fail these checks.
        if: github.event_name == 'push'
        # Fail-fast proof that both packages install together without file
        # conflicts, that `kuml` lands on PATH and that the desktop launcher
        # file is shipped. Uses only apt for dependencies.
        shell: bash
        run: |
          set -euo pipefail
          ls -l kuml-packaging/build/dist kuml-desktop/build/compose/binaries/main/deb kuml-desktop/build/compose/binaries/main/rpm
          sudo apt-get install -y ./kuml-packaging/build/dist/kuml_*.deb ./kuml-desktop/build/compose/binaries/main/deb/kuml-desktop_*.deb
          command -v kuml
          kuml --version
          dpkg -L kuml-desktop | grep -E '\.desktop$'
          ls -l /usr/bin/kuml

      - name: Upload DEB + RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          # One glob per line: upload-artifact does not expand `{deb,rpm}`
          # brace patterns, so the former single pattern matched nothing and
          # the packages were silently discarded ("No files were found").
          path: |
            kuml-packaging/build/dist/*.deb
            kuml-packaging/build/dist/*.rpm
            kuml-desktop/build/compose/binaries/main/deb/*.deb
            kuml-desktop/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

      - name: Attach DEB + RPM to the GitHub Release
        # The Release is created by release.yml for the same tag, in parallel
        # with this workflow, so wait for it to exist before uploading. The
        # apt repository (kuml-dev/apt) pulls its .deb files from here.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          DEBS=(kuml-packaging/build/dist/*.deb kuml-desktop/build/compose/binaries/main/deb/*.deb)
          RPMS=(kuml-packaging/build/dist/*.rpm kuml-desktop/build/compose/binaries/main/rpm/*.rpm)
          FILES=("${DEBS[@]}" "${RPMS[@]}")
          if [ "${#DEBS[@]}" -lt 2 ] || [ "${#RPMS[@]}" -lt 2 ]; then
            echo "::error::expected CLI + desktop .deb and .rpm (got ${#DEBS[@]} deb, ${#RPMS[@]} rpm) in kuml-packaging/build/dist and kuml-desktop/build/compose/binaries/main/{deb,rpm}"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "${FILES[@]}" --clobber; then
                exit 0
              fi
              echo "::warning::gh release upload attempt $attempt failed for $TAG"
            else
              echo "Release $TAG does not exist yet (attempt $attempt/30)"
            fi
            sleep 30
          done
          echo "::error::could not attach DEB/RPM to release $TAG"
          exit 1

      - name: Trigger the APT and RPM repository rebuilds
        # Tells kuml-dev/apt and kuml-dev/rpm that new .deb/.rpm files are attached
        # to the release. Never fails the release: without the token or on an API
        # error a repository can be rebuilt by hand (workflow_dispatch in that
        # repository). The token has to reach both repositories.
        shell: bash
        env:
          APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$APT_DISPATCH_TOKEN" ]; then
            echo "::warning::APT_DISPATCH_TOKEN is not set; run the publish workflows of kuml-dev/apt and kuml-dev/rpm by hand"
            exit 0
          fi
          for repo in apt rpm; do
            if ! GH_TOKEN="$APT_DISPATCH_TOKEN" gh api "repos/kuml-dev/${repo}/dispatches" \
                -f event_type=kuml-release \
                -f "client_payload[tag]=${{ github.event.inputs.tag || github.ref_name }}"; then
              echo "::warning::could not trigger the ${repo} repository rebuild"
            fi
          done

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker CLI image
        if: github.event_name == 'push'
        run: ./gradlew :kuml-packaging:dockerBuildCli

      - name: Push Docker image (version tag + latest)
        if: github.event_name == 'push'
        # Strip the leading 'v' from the git tag — Gradle's dockerBuildCli task
        # tags the image with project.version (e.g. "0.6.0"), not the git ref
        # "v0.6.0". Pushing "v0.6.0" would fail with "tag does not exist".
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker push ghcr.io/kuml-dev/kuml-cli:latest
          docker push ghcr.io/kuml-dev/kuml-cli:"$VERSION"

  # ── Linux: AppImage of the desktop app (x86_64) ─────────────────────────────
  build-appimage:
    # ubuntu-22.04 instead of ubuntu-latest: AppImage guidance is to build on the
    # oldest supported base so the image runs on more systems (glibc). No native
    # code is compiled here; the bundled JRE (Temurin) and the Skiko libraries
    # bring their own glibc requirement, so the runner choice mainly affects the
    # appimagetool/runtime step. Replace when GitHub retires the 22.04 image.
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # gh release upload only
    env:
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      # The code to package (the release tag).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # The AppImage scripts from the workflow's own commit: an old tag checked out
      # by a manual dispatch does not contain them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .appimage-tooling
          sparse-checkout: kuml-packaging/src/main/appimage

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AppImage smoke-test tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils xvfb

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid tag '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build desktop app image
        run: ./gradlew :kuml-desktop:createDistributable

      - name: Check Gradle version against the tag (warning only)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          GRADLE_VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | head -1)"
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "::warning::build.gradle.kts version '$GRADLE_VERSION' differs from the tag version '$VERSION'"
          fi

      - name: Download pinned appimagetool and runtime (SHA-256 verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          cd "$RUNNER_TEMP/appimage-tools"
          curl -fsSL --retry 3 -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL --retry 3 -o runtime-x86_64 "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          echo "$APPIMAGE_RUNTIME_SHA256  runtime-x86_64" | sha256sum -c -
          chmod +x appimagetool

      - name: Build AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/appimage
          APPIMAGETOOL="$RUNNER_TEMP/appimage-tools/appimagetool" \
          APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage-tools/runtime-x86_64" \
          bash .appimage-tooling/kuml-packaging/src/main/appimage/build-appimage.sh \
            kuml-desktop/build/compose/binaries/main/app/kuml-desktop \
            kuml-desktop/src/jvmMain/resources/icons/kuml-desktop.png \
            "$VERSION" \
            "build/appimage/kuml-desktop-$VERSION-x86_64.AppImage"

      - name: Smoke test AppImage
        shell: bash
        env:
          SMOKE_GUI: "1"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash .appimage-tooling/kuml-packaging/src/main/appimage/smoke-appimage.sh \
            "build/appimage/kuml-desktop-$VERSION-x86_64.AppImage" "$VERSION"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to the GitHub Release
        # Same wait loop as build-linux: release.yml creates the Release in
        # parallel for the same tag.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          shopt -s nullglob
          FILES=(build/appimage/*.AppImage)
          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one AppImage in build/appimage (got ${#FILES[@]})"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "${FILES[@]}" --clobber; then
                exit 0
              fi
              echo "::warning::gh release upload attempt $attempt failed for $TAG"
            else
              echo "Release $TAG does not exist yet (attempt $attempt/30)"
            fi
            sleep 30
          done
          echo "::error::could not attach the AppImage to release $TAG"
          exit 1

  # ── macOS: DMG (unsigned — Phase 2 adds Apple Developer signing) ─────────────
  build-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build DMG (unsigned)
        run: ./gradlew :kuml-packaging:packageDmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: kuml-packaging/build/dist/*.dmg

  # ── Windows: MSI (unsigned — Phase 2 adds WiX/Authenticode signing) ──────────
  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build MSI (unsigned)
        run: ./gradlew :kuml-packaging:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: kuml-packaging/build/dist/*.msi
