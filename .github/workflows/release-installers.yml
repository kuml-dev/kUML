name: Release Installers

# Triggered on version tags — e.g. v0.5.1, v2.0.32
on:
  push:
    tags:
      - 'v*.*.*'
  # Manual run for an existing tag: builds only the Linux packages (DEB/RPM of the
  # CLI and of the desktop app) from that tag and attaches them to its release
  # (no Docker push, no DMG/MSI). The DEB smoke test is skipped here: it checks the
  # PATH symlink and desktop shortcut, which tags released before those changes
  # (up to v0.56.0) do not contain, so it would fail the backfill.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the CLI and desktop DEB/RPM for (e.g. v0.56.0)"
        required: true

jobs:
  # ── Linux: DEB + RPM + Docker image ─────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload (DEB/RPM attach to the GitHub Release)
      packages: write  # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build DEB
        run: ./gradlew :kuml-packaging:packageDeb

      - name: Build RPM
        run: ./gradlew :kuml-packaging:packageRpm

      - name: Build desktop DEB
        run: ./gradlew :kuml-desktop:packageDeb

      - name: Build desktop RPM
        run: ./gradlew :kuml-desktop:packageRpm

      - name: Smoke test DEB install (CLI + desktop side by side)
        # Push (new release tag) only: old tags checked out by a manual dispatch
        # predate the postinst/shortcut changes and would fail these checks.
        if: github.event_name == 'push'
        # Fail-fast proof that both packages install together without file
        # conflicts, that `kuml` lands on PATH and that the desktop launcher
        # file is shipped. Uses only apt for dependencies.
        shell: bash
        run: |
          set -euo pipefail
          ls -l kuml-packaging/build/dist kuml-desktop/build/compose/binaries/main/deb kuml-desktop/build/compose/binaries/main/rpm
          sudo apt-get install -y ./kuml-packaging/build/dist/kuml_*.deb ./kuml-desktop/build/compose/binaries/main/deb/kuml-desktop_*.deb
          command -v kuml
          kuml --version
          dpkg -L kuml-desktop | grep -E '\.desktop$'
          ls -l /usr/bin/kuml

      - name: Upload DEB + RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          # One glob per line: upload-artifact does not expand `{deb,rpm}`
          # brace patterns, so the former single pattern matched nothing and
          # the packages were silently discarded ("No files were found").
          path: |
            kuml-packaging/build/dist/*.deb
            kuml-packaging/build/dist/*.rpm
            kuml-desktop/build/compose/binaries/main/deb/*.deb
            kuml-desktop/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

      - name: Attach DEB + RPM to the GitHub Release
        # The Release is created by release.yml for the same tag, in parallel
        # with this workflow, so wait for it to exist before uploading. The
        # apt repository (kuml-dev/apt) pulls its .deb files from here.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          DEBS=(kuml-packaging/build/dist/*.deb kuml-desktop/build/compose/binaries/main/deb/*.deb)
          RPMS=(kuml-packaging/build/dist/*.rpm kuml-desktop/build/compose/binaries/main/rpm/*.rpm)
          FILES=("${DEBS[@]}" "${RPMS[@]}")
          if [ "${#DEBS[@]}" -lt 2 ] || [ "${#RPMS[@]}" -lt 2 ]; then
            echo "::error::expected CLI + desktop .deb and .rpm (got ${#DEBS[@]} deb, ${#RPMS[@]} rpm) in kuml-packaging/build/dist and kuml-desktop/build/compose/binaries/main/{deb,rpm}"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "${FILES[@]}" --clobber; then
                exit 0
              fi
              echo "::warning::gh release upload attempt $attempt failed for $TAG"
            else
              echo "Release $TAG does not exist yet (attempt $attempt/30)"
            fi
            sleep 30
          done
          echo "::error::could not attach DEB/RPM to release $TAG"
          exit 1

      - name: Trigger APT repository rebuild
        # Tells kuml-dev/apt that a new .deb is attached to the release. Never
        # fails the release: without the token or on an API error the apt
        # repository can be rebuilt by hand (workflow_dispatch in kuml-dev/apt).
        shell: bash
        env:
          APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$APT_DISPATCH_TOKEN" ]; then
            echo "::warning::APT_DISPATCH_TOKEN is not set; run the apt publish workflow by hand"
            exit 0
          fi
          if ! GH_TOKEN="$APT_DISPATCH_TOKEN" gh api repos/kuml-dev/apt/dispatches \
              -f event_type=kuml-release \
              -f "client_payload[tag]=${{ github.event.inputs.tag || github.ref_name }}"; then
            echo "::warning::could not trigger the apt repository rebuild"
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker CLI image
        if: github.event_name == 'push'
        run: ./gradlew :kuml-packaging:dockerBuildCli

      - name: Push Docker image (version tag + latest)
        if: github.event_name == 'push'
        # Strip the leading 'v' from the git tag — Gradle's dockerBuildCli task
        # tags the image with project.version (e.g. "0.6.0"), not the git ref
        # "v0.6.0". Pushing "v0.6.0" would fail with "tag does not exist".
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker push ghcr.io/kuml-dev/kuml-cli:latest
          docker push ghcr.io/kuml-dev/kuml-cli:"$VERSION"

  # ── macOS: DMG (unsigned — Phase 2 adds Apple Developer signing) ─────────────
  build-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build DMG (unsigned)
        run: ./gradlew :kuml-packaging:packageDmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: kuml-packaging/build/dist/*.dmg

  # ── Windows: MSI (unsigned — Phase 2 adds WiX/Authenticode signing) ──────────
  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js (kuml-web frontend build, Vite requires ^20.19 or >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow JAR
        run: ./gradlew :kuml-cli:shadowJar

      - name: Build MSI (unsigned)
        run: ./gradlew :kuml-packaging:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: kuml-packaging/build/dist/*.msi
